<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לומדים אנגלית – שכבה ד’</title>
<style>
:root{--bg:#EAF4EE;--card:#fff;--ink:#1B3227;--mut:#58715F;--line:#CDE1D4;--leaf:#23905A;--leaf2:#D6EEDF;--sun:#FFC53A;--sun2:#FFF1C9;--berry:#D9416B;--berry2:#FBE0E8;--sky:#2F6FD0;--sky2:#DCE8FA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1D17;--card:#172A22;--ink:#E6F2EA;--mut:#9BB6A6;--line:#2A4236;--leaf:#4BC283;--leaf2:#1E3D2E;--sun:#FFD15C;--sun2:#3A3218;--berry:#F0779A;--berry2:#43202C;--sky:#7FADF0;--sky2:#1C2E4A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1D17;--card:#172A22;--ink:#E6F2EA;--mut:#9BB6A6;--line:#2A4236;--leaf:#4BC283;--leaf2:#1E3D2E;--sun:#FFD15C;--sun2:#3A3218;--berry:#F0779A;--berry2:#43202C;--sky:#7FADF0;--sky2:#1C2E4A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,"Segoe UI",Arial,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:calc(100vh - 44px);box-sizing:border-box}
h1{font-size:1.6rem;margin:6px 0;text-align:center}
.sub{color:var(--mut);text-align:center;margin:0}
button{font:inherit;font-weight:700;border:0;border-radius:16px;padding:14px 16px;cursor:pointer;background:var(--leaf);color:#fff;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.ghost{background:transparent;color:var(--leaf);border:2px solid var(--leaf);padding:8px 14px}
.menu{display:grid;gap:10px}
.menu button{display:flex;align-items:center;gap:12px;font-size:1.15rem;text-align:start}
.menu b{font-size:1.9rem}
.m1{background:var(--sky)}.m2{background:var(--berry)}.m3{background:#C98A00}.m4{background:var(--leaf)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut)}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.pic{font-size:5.5rem;line-height:1.1}
.en{font-size:2.6rem;font-weight:800;direction:ltr}
.nk{font-size:1.7rem;font-weight:700;color:var(--berry)}
.he{font-size:1.5rem}
.ls{display:flex;gap:6px;direction:ltr;flex-wrap:wrap;justify-content:center}
.ls i{font-style:normal;font-weight:700;font-size:1.2rem;min-width:1.5em;padding:2px 4px;border-radius:8px;background:var(--leaf2);color:var(--mut)}
.ls i.on{background:var(--sun);color:#1B3227}
.sent{font-size:1.3rem;direction:ltr;background:var(--sky2);border-radius:14px;padding:8px 14px}
.sent b{color:var(--sky)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.row button{background:var(--sky);padding:10px 14px}
.nav{display:flex;justify-content:space-between;gap:10px}
.nav button{flex:1}
.prompt{text-align:center;color:var(--mut);margin:0}
.opts{display:grid;gap:10px}
.opts.g2{grid-template-columns:1fr 1fr}
.opt{background:var(--card);color:var(--ink);border:3px solid var(--line);font-size:1.25rem}
.opt.en2{direction:ltr}
.opt.pic2{font-size:3.4rem;padding:8px}
.opt.ok{background:var(--leaf);border-color:var(--leaf);color:#fff}
.opt.bad{background:var(--berry2);border-color:var(--berry);color:var(--berry);text-decoration:line-through}
.msg{text-align:center;font-weight:700;min-height:1.5em;margin:0}
.big{font-size:3rem;text-align:center}
.pop{display:inline-block;background:var(--leaf2);color:var(--leaf);border-radius:16px;padding:8px 16px;font-size:1.25rem;animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.nm{font:inherit;font-size:1.4rem;text-align:center;padding:12px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink)}
.nm:focus{outline:none;border-color:var(--leaf)}
.micb{background:var(--berry);font-size:1.3rem;padding:16px;width:100%}
.wopt{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:1.15rem}
.oe{font-size:2.6rem;line-height:1.1}
#rec{display:flex;flex-direction:column;gap:8px}
.orow{display:flex;gap:8px;align-items:stretch}.orow .opt{flex:1}
.spk{background:var(--sky);padding:0 14px;font-size:1.3rem;border-radius:16px;min-width:56px}
.tr{background:var(--leaf2);border-radius:14px;padding:10px 14px;text-align:center;font-size:1.15rem;display:flex;flex-direction:column;gap:4px}
.tr:empty{display:none}
.m5{background:#7B4FC9}
.trow{display:flex;align-items:center;justify-content:center;gap:14px}
.cvw{background:var(--card);border:3px dashed var(--line);border-radius:20px;overflow:hidden;touch-action:none}
#cv{display:block;width:100%;height:200px;touch-action:none}
.chk{background:var(--leaf)}
.ttl{font-size:1.35rem;line-height:1.4}
.ft{text-align:center;font-size:.75rem;color:var(--mut);padding:0 0 calc(10px + env(safe-area-inset-bottom,0px))}
.score{font-size:1.3rem;color:inherit;text-align:center;margin:0}
</style>

</head>
<body>
<div id="app"></div>
<footer class="ft">נערך ע״י מירב כהן</footer>
<script>
// [English, Hebrew, nikud, picture, short sentence, spoken text (if different)]
const D=[
["What’s your name?","מה השם שלך?","וֹוטְס יוֹר נֵיים","🏷️","My name is Dan."],
["My name is …","השם שלי זה…","מַיי נֵיים אִיז …","😀","My name is Dan.","My name is"],
["How old are you?","בן/בת כמה את/ה?","הַאוּ אוֹלְד אַר יוּ","🎂","I am nine years old."],
["I am ___ years old.","אני בן/בת …","אַיי אֶם … יִירְז אוֹלְד","🔢","I am nine years old.","I am nine years old"],
["Where do you live?","איפה את/ה גר/ה?","וֵור דוּ יוּ לִיב","📍","I live in Haifa."],
["I live in …","אני גר/ה ב…","אַיי לִיב אִין …","🏙️","I live in Haifa.","I live in"],
["family","משפחה","פֶמִילִי","👨‍👩‍👧","This is my family."],
["grade","כיתה","גְרֵייד","📝","I am in the fourth grade."],
["sister","אחות","סִיסְטֶר","👧","My sister is nice."],
["brother","אח","בְּרַאדֶר","👦","My brother can run."],
["chair","כיסא","צֶ’ר","🪑","Sit on the chair."],
["meet","לפגוש","מִיט","🤝","Nice to meet you."],
["need","צריך","נִיד","🙏","I need a pencil."],
["write","לכתוב","רַייט","✍️","I write my name."],
["pupil","תלמיד/ה","פְּיוּפִּל","🎒","The pupil reads a book."],
["teacher","מורה","טִיצֶ’ר","👩‍🏫","My teacher is kind."],
["friend","חבר/ה","פְרֶנְד","🧑‍🤝‍🧑","She is my friend."],
["house","בית","הַאוּס","🏠","This is my house."],
["lunch","ארוחת צהריים","לַנְץ’","🥪","I eat lunch at school."],
["learn","ללמוד","לֶרְן","📚","I learn English."]
];
const WORDS=D.slice(6);
const TR={"This is my family.":"זו המשפחה שלי.","I am in the fourth grade.":"אני בכיתה ד’.","My sister is nice.":"האחות שלי נחמדה.","My brother can run.":"האח שלי יכול לרוץ.","Sit on the chair.":"שב/י על הכיסא.","Nice to meet you.":"נעים להכיר אותך.","I need a pencil.":"אני צריך/ה עיפרון.","I write my name.":"אני כותב/ת את השם שלי.","The pupil reads a book.":"התלמיד קורא ספר.","My teacher is kind.":"המורה שלי אדיבה.","She is my friend.":"היא החברה שלי.","This is my house.":"זה הבית שלי.","I eat lunch at school.":"אני אוכל/ת ארוחת צהריים בבית הספר.","I learn English.":"אני לומד/ת אנגלית."};
let NAME='';
function chime(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[660,880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.12;o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.22)})}catch(e){}}
function win(msg,first){chime();msg.innerHTML=`<span class="pop">${first?`🎉 כל הכבוד ${NAME}! 🎉`:`👍 נכון! הפעם הצלחת, ${NAME}`}</span>`}
const QA=[["What’s your name?","My name is Dan.","🏷️","מה השם שלך?","השם שלי הוא דן."],["How old are you?","I am nine years old.","🎂","בן/בת כמה את/ה?","אני בן/בת תשע."],["Where do you live?","I live in Haifa.","🏠","איפה את/ה גר/ה?","אני גר/ה בחיפה."]];
const LN={a:'A.',b:'bee',c:'see',d:'dee',e:'ee',f:'eff',g:'jee',h:'aitch',i:'eye',j:'jay',k:'kay',l:'el',m:'em',n:'en',o:'oh',p:'pee',q:'cue',r:'ar',s:'ess',t:'tee',u:'you',v:'vee',w:'double you',x:'ex',y:'why',z:'zee'};
const app=document.getElementById('app');
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
let tok=0;
function say(t,rate,cb){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate||.85;
    const v=speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));if(v)u.voice=v;
    if(cb){u.onend=cb;u.onerror=cb}
    speechSynthesis.speak(u);
  }catch(e){cb&&cb()}
}
const spoken=d=>d[5]||d[0];
function hearW(i){tok++;say(spoken(D[i]),.7)}
function hearS(i){tok++;say(D[i][4],.85)}
function spell(i){
  const my=++tok,s=[...D[i][0]],ls=document.querySelectorAll('#ls i');let k=0;
  const mark=j=>ls.forEach((e,n)=>e.classList.toggle('on',n===j));
  const go=()=>{if(my!==tok){mark(-1);return}if(k>=s.length){mark(-1);return}mark(k);say(LN[s[k].toLowerCase()],.8,()=>{k++;setTimeout(go,150)})};
  go();
}
function nameScreen(){
  tok++;
  app.innerHTML=`<div class="big">👋</div><h1 class="ttl">מבדק מס’ 2 – שכבה ד’<br>בית החינוך ע״ש שמעון פרס</h1><p class="sub" style="font-size:1.35rem;color:inherit;font-weight:700">שלום! איך קוראים לך?</p><p class="sub">כתבו את השם ולחצו על הכפתור</p>
  <input class="nm" id="nm" maxlength="15" autocomplete="off" value="${NAME}" placeholder="השם שלך">
  <p class="msg" id="nmsg"></p><button id="go" style="font-size:1.3rem">בואו נתחיל ←</button>`;
  const go=()=>{const v=document.getElementById('nm').value.replace(/[<>&"]/g,'').trim().slice(0,15);if(!v){document.getElementById('nmsg').textContent='צריך לכתוב שם 🙂';return}NAME=v;home()};
  document.getElementById('go').onclick=go;
  document.getElementById('nm').onkeydown=e=>{if(e.key==='Enter')go()};
}
function home(){
  tok++;try{speechSynthesis.cancel()}catch(e){}
  app.innerHTML=`<h1>היי ${NAME}! 🎓</h1><p class="sub">אוצר מילים – שכבה ד’<br>לוחצים על 🔊 כדי לשמוע</p>
  <div class="menu">
  <button class="m1" onclick="learn(0)"><b>📖</b>ללמוד מילים ומשפטים</button>
  <button class="m2" onclick="wstart()"><b>🧩</b>מילים: פירוש, איות והקלטה</button>
  <button class="m5" onclick="tstart()"><b>✏️</b>כתיבה באצבע</button>
  <button class="m4" onclick="quiz('q')"><b>💬</b>שאלה ← תשובה</button><button class="ghost" onclick="nameScreen()">👤 לא ${NAME}? להחליף שם</button></div>`;
}
const ALIKE={meet:['meat'],need:['knead','kneed'],write:['right','rite'],house:['hause'],grade:['grayed'],learn:['lern']};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const nrm=s=>(s||'').toLowerCase().replace(/[’']m\b/g,' am').replace(/[’']s\b/g,' is').replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();
const lev=(a,b)=>{const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]};
const sim=(a,b)=>!a||!b?0:1-lev(a,b)/Math.max(a.length,b.length);
const skel=w=>w.replace(/ck|q/g,'k').replace(/ph/g,'f').replace(/[bp]/g,'p').replace(/[dt]/g,'t').replace(/[gkc]/g,'k').replace(/[vf]/g,'f').replace(/[zs]/g,'s').replace(/(.)\1+/g,'$1').replace(/[aeiouyw]/g,'');
function score(target,alts){
  const want=nrm(target).split(' ').filter(Boolean);let best=0;
  for(const t of alts){const got=nrm(t).split(' ').filter(Boolean);if(!got.length)continue;
    const parts=want.map(w=>Math.max(0,...got.map(g=>g===w||(ALIKE[w]||[]).includes(g)?1:(skel(g)&&skel(g)===skel(w))?.85:sim(w,g)*.9)));
    best=Math.max(best,parts.reduce((a,b)=>a+b,0)/parts.length)}
  return best;
}
function showNext(js,label){document.getElementById('nx').innerHTML=`<button onclick="${js}">${label}</button>`}
// Recording step: the child says the target; only a good match (or the fallback button when the mic is unavailable) lets them move on
function recStep(target,done){
  const box=document.getElementById('rec');let tries=0,blocked=!SR;
  box.innerHTML=`<p class="prompt">עכשיו אומרים בקול 🎤</p><button class="micb" id="mic">🎤 לחצו כדי להקליט</button><p class="msg" id="rmsg"></p><div id="skip"></div>`;
  const mic=document.getElementById('mic'),rm=document.getElementById('rmsg'),sk=document.getElementById('skip');
  const idle=()=>{mic.disabled=false;mic.textContent='🎤 לנסות שוב'};
  const more=()=>{if(blocked||tries>=3){sk.innerHTML=`<button class="ghost" id="skb">${blocked?'המיקרופון לא זמין כאן – להמשיך':'לא מצליח – להמשיך'}</button>`;document.getElementById('skb').onclick=()=>{sk.innerHTML='';done()}}};
  const miss=m=>{tries++;rm.innerHTML=m;idle();more()};
  mic.onclick=()=>{
    if(!SR){blocked=true;rm.textContent='הדפדפן הזה לא תומך בהקלטה';more();return}
    tok++;try{speechSynthesis.cancel()}catch(e){}
    let r;try{r=new SR()}catch(e){blocked=true;rm.textContent='אי אפשר להקליט כאן';more();return}
    r.lang='en-US';r.maxAlternatives=5;r.interimResults=false;
    mic.disabled=true;mic.textContent='🎤 מקשיבים… דברו עכשיו';rm.textContent='';
    let over=false;const t=setTimeout(()=>{try{r.stop()}catch(e){}},7000);
    const end=f=>{if(over)return;over=true;clearTimeout(t);f()};
    r.onresult=ev=>end(()=>{
      const a=[...ev.results[0]].map(x=>x.transcript);
      if(score(target,a)>=.8){mic.remove();sk.innerHTML='';win(rm,tries===0);done()}
      else miss(`שמעתי: <b lang="en" dir="ltr">${a[0]}</b>. ננסו שוב 💪`);
    });
    r.onerror=e=>end(()=>{
      if(e.error==='not-allowed'||e.error==='service-not-allowed'){blocked=true;rm.textContent='הדפדפן חוסם את המיקרופון בעמוד הזה';idle();more()}
      else miss('לא שמעתי, נסו שוב קרוב יותר 🙉');
    });
    r.onend=()=>end(()=>miss('לא שמעתי, נסו שוב 🙉'));
    try{r.start()}catch(e){end(()=>miss('אי אפשר להתחיל הקלטה'))}
  };
}
// Learn: sentence translation (4 options), then record the sentence
function learn(i){
  if(i===0)LS={ok:0};tok++;const d=D[i],w=i>5,S=w?d[4]:spoken(d),T=w?TR[d[4]]:d[1];
  const pool=w?Object.values(TR):D.slice(0,6).map(x=>x[1]);
  const opts=sh([T,...sh(pool.filter(x=>x!==T)).slice(0,3)]);
  const sent=w?`<div class="sent" lang="en">${d[4].replace(new RegExp('\\b'+d[0]+'\\b','i'),m=>`<b>${m}</b>`)}</div>`:'';
  app.innerHTML=`<div class="top"><button class="ghost" onclick="home()">→ תפריט</button><span>${i+1} / ${D.length}</span></div>
  <div class="card"><div class="pic">${d[3]}</div><div class="en" style="font-size:${d[0].length>14?'1.7rem':'2.6rem'}" lang="en">${d[0]}</div><div class="nk">${d[2]}</div>${sent}
  <div class="row"><button onclick="hearW(${i})">🔊 ${w?'מילה':'משפט'}</button>${w?`<button onclick="hearS(${i})">🔊 משפט</button>`:''}</div></div>
  <p class="prompt">מה התרגום של המשפט?</p>
  <div class="opts">${opts.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div>
  <p class="msg" id="msg"></p><div id="rec"></div><div class="nav" id="nx"></div>`;
  const msg=document.getElementById('msg');let first=true;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(b.dataset.v===T){
      b.classList.add('ok');app.querySelectorAll('.opt').forEach(x=>x.disabled=true);if(first)LS.ok++;win(msg,first);
      const last=i>=D.length-1;recStep(S,()=>showNext(last?'lfin()':`learn(${i+1})`,last?'לסיכום 🏁':'המשפט הבא ←'));
    }else{first=false;b.classList.add('bad');b.disabled=true;msg.textContent='לא בדיוק, נסו תשובה אחרת 🙂'}
  });
  setTimeout(()=>say(S,.8),250);
}
// Words: pick the meaning (picture + Hebrew) → letters spelled aloud with highlight → record the word
function spellW(word,cb){
  const my=++tok,ls=document.getElementById('ls');
  ls.innerHTML=[...word].map(c=>`<i>${c.toUpperCase()}</i>`).join('');
  const it=[...ls.children];let k=0;
  const go=()=>{
    if(my!==tok)return;
    it.forEach((e,n)=>e.classList.toggle('on',n===k));
    if(k>=word.length){it.forEach(e=>e.classList.remove('on'));cb();return}
    say(LN[word[k].toLowerCase()],.8,()=>{k++;setTimeout(go,150)});
  };
  go();
}
let Q=null;
function wstart(){tok++;Q={mode:'w',r:sh(WORDS).slice(0,10),i:0,ok:0};wq()}
function wq(){
  tok++;const d=Q.r[Q.i],idx=D.indexOf(d);
  const opts=sh([d,...sh(WORDS.filter(x=>x!==d)).slice(0,3)]);
  app.innerHTML=`<div class="top"><button class="ghost" onclick="home()">→ תפריט</button><span>${Q.i+1} / ${Q.r.length}</span></div>
  <p class="prompt">מה הפירוש של המילה?</p>
  <div class="card"><div class="en" lang="en">${d[0]}</div><div class="nk">${d[2]}</div><div class="ls" id="ls"></div>
  <button class="ghost" onclick="hearW(${idx})">🔊 להקשיב</button></div>
  <div class="opts g2">${opts.map(o=>`<button class="opt wopt" data-v="${o[1]}"><span class="oe">${o[3]}</span>${o[1]}</button>`).join('')}</div>
  <p class="msg" id="msg"></p><div id="rec"></div><div class="nav" id="nx"></div>`;
  const msg=document.getElementById('msg');let first=true;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(b.dataset.v===d[1]){
      if(first)Q.ok++;
      b.classList.add('ok');app.querySelectorAll('.opt').forEach(x=>x.disabled=true);win(msg,first);
      const last=Q.i===Q.r.length-1;
      spellW(d[0],()=>recStep(d[0],()=>showNext(last?'fin()':'Q.i++;wq()',last?'לסיכום 🏁':'הבא ←')));
    }else{first=false;b.classList.add('bad');b.disabled=true;msg.textContent='לא בדיוק, נסו תשובה אחרת 🙂'}
  });
  setTimeout(()=>say(spoken(d),.8),250);
}
// Writing: the child traces the word with a finger; it is checked by how much of the letters is covered and how much stays inside them
function tstart(){tok++;Q={mode:'t',r:sh(WORDS).slice(0,10),i:0,ok:0};tq()}
function tq(){
  tok++;const d=Q.r[Q.i],word=d[0],idx=D.indexOf(d),last=Q.i===Q.r.length-1;
  app.innerHTML=`<div class="top"><button class="ghost" onclick="home()">→ תפריט</button><span>${Q.i+1} / ${Q.r.length}</span></div>
  <p class="prompt">כתבו את המילה באצבע, על גבי האותיות ✏️</p>
  <div class="card"><div class="trow"><button class="spk" onclick="hearW(${idx})" aria-label="להקשיב">🔊</button><div><div class="he"><b>${d[1]}</b></div><div class="nk">${d[2]}</div></div><span style="font-size:2.6rem">${d[3]}</span></div></div>
  <div class="cvw"><canvas id="cv"></canvas></div>
  <div class="row"><button class="chk" id="chk">✔ בדיקה</button><button class="ghost" id="clr">🧽 למחוק</button></div>
  <p class="msg" id="msg"></p><div class="nav" id="nx"></div>`;
  const cv=document.getElementById('cv'),msg=document.getElementById('msg');
  const W=cv.clientWidth||320,H=200;cv.width=W;cv.height=H;
  const cx=cv.getContext('2d'),icv=document.createElement('canvas');icv.width=W;icv.height=H;const ic=icv.getContext('2d'),icw=document.createElement('canvas');icw.width=W;icw.height=H;const iw=icw.getContext('2d');
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';
  const font=f=>`bold ${f}px system-ui,Arial,sans-serif`;
  const m0=document.createElement('canvas').getContext('2d');let fs=140;
  while(fs>30){m0.font=font(fs);if(m0.measureText(word).width<=W*.88&&fs<=H*.6)break;fs-=4}
  const mask=stroke=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    x.font=font(fs);x.textAlign='center';x.textBaseline='middle';x.fillStyle=x.strokeStyle='#000';x.lineJoin='round';
    if(stroke){x.lineWidth=stroke;x.strokeText(word,W/2,H/2)}x.fillText(word,W/2,H/2);return x.getImageData(0,0,W,H).data};
  const tgt=mask(0),tol=mask(fs*.14),bw=Math.max(5,fs*.08),bwc=Math.max(10,fs*.16),inkc=css('--berry');
  let fails=0,down=false,done=false,lx=0,ly=0;
  const guide=()=>{cx.clearRect(0,0,W,H);cx.save();cx.globalAlpha=fails>=3?.55:.28;cx.fillStyle=css('--mut');cx.font=font(fs);cx.textAlign='center';cx.textBaseline='middle';cx.fillText(word,W/2,H/2);cx.restore();cx.drawImage(icv,0,0)};
  guide();
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
  const seg=(a,b,c,d2)=>{for(const[k,w] of[[cx,bw],[ic,bw],[iw,bwc]]){k.strokeStyle=inkc;k.lineWidth=w;k.lineCap=k.lineJoin='round';k.beginPath();k.moveTo(a,b);k.lineTo(c,d2);k.stroke()}};
  cv.onpointerdown=e=>{if(done)return;down=true;[lx,ly]=pos(e);seg(lx,ly,lx,ly);try{cv.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()};
  cv.onpointermove=e=>{if(!down||done)return;const[x,y]=pos(e);seg(lx,ly,x,y);lx=x;ly=y;e.preventDefault()};
  cv.onpointerup=cv.onpointercancel=()=>{down=false};
  document.getElementById('clr').onclick=()=>{if(done)return;ic.clearRect(0,0,W,H);iw.clearRect(0,0,W,H);guide();msg.textContent=''};
  document.getElementById('chk').onclick=()=>{
    if(done)return;
    const ink=ic.getImageData(0,0,W,H).data,wide=iw.getImageData(0,0,W,H).data;let t=0,c=0,n=0,inn=0;
    for(let i=3;i<ink.length;i+=4){const a=ink[i]>40,tg=tgt[i]>100;if(tg){t++;if(wide[i]>40)c++}if(a){n++;if(tol[i]>100)inn++}}
    const cov=c/t,prec=n?inn/n:0;
    if(cov>=.7&&prec>=.75){
      done=true;document.getElementById('chk').disabled=true;document.getElementById('clr').disabled=true;
      if(fails===0)Q.ok++;win(msg,fails===0);tok++;say(spoken(d),.8);
      showNext(last?'fin()':'Q.i++;tq()',last?'לסיכום 🏁':'המילה הבאה ←');
    }else{
      fails++;
      msg.textContent=n<t*.05?'עוד לא כתבתם כלום. עברו באצבע על האותיות 🙂':cov<.7?'כמעט! עברו על כל האותיות, עד הסוף ✨':'נסו להישאר בתוך האותיות 💪';
      if(fails===3){guide();msg.textContent+=' (הדגשתי את האותיות)'}
    }
  };
}
// Question ↔ answer
function quiz(){
  tok++;const r=[];
  QA.forEach(p=>{
    r.push({p,show:p[0],say:p[0],right:p[1],opts:sh(QA.map(x=>x[1])),ask:'מה התשובה המתאימה לשאלה?'});
    r.push({p,show:p[1],say:p[1],right:p[0],opts:sh(QA.map(x=>x[0])),ask:'מה השאלה המתאימה לתשובה?'});
  });
  Q={mode:'q',r:sh(r),i:0,ok:0};rnd();
}
function rnd(){
  const q=Q.r[Q.i];q.first=null;
  app.innerHTML=`<div class="top"><button class="ghost" onclick="home()">→ תפריט</button><span>${Q.i+1} / ${Q.r.length}</span></div>
  <p class="prompt">${q.ask}</p>
  <div class="card"><div class="pic" style="font-size:3.6rem">${q.p[2]}</div><div class="en" style="font-size:${q.show.length>14?'1.7rem':'2.4rem'}" lang="en">${q.show}</div><button class="ghost" onclick="tok++;say(Q.r[Q.i].say,.8)">🔊 להקשיב</button></div>
  <div class="opts">${q.opts.map(o=>`<div class="orow"><button class="spk" data-s="${o}" aria-label="להקשיב">🔊</button><button class="opt en2" data-v="${o}">${o}</button></div>`).join('')}</div>
  <p class="msg" id="msg"></p><div class="tr" id="tr"></div><div class="nav" id="nx"></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b,q));
  app.querySelectorAll('.spk').forEach(b=>b.onclick=()=>{tok++;say(b.dataset.s,.8)});
  setTimeout(()=>say(q.say,.8),250);
}
function pick(b,q){
  const ok=b.dataset.v===q.right,msg=document.getElementById('msg');
  if(q.first===null){q.first=ok;if(ok)Q.ok++}
  if(ok){
    b.classList.add('ok');app.querySelectorAll('.opt').forEach(x=>x.disabled=true);win(msg,q.first);document.getElementById('tr').innerHTML=`<div>❓ ${q.p[3]}</div><div>💬 ${q.p[4]}</div>`;say(q.right,.8);
    const last=Q.i===Q.r.length-1;
    showNext(last?'fin()':'Q.i++;rnd()',last?'לסיכום 🏁':'הבא ←');
  }else{b.classList.add('bad');b.disabled=true;msg.textContent='לא בדיוק, נסו תשובה אחרת 🙂'}
}
const TP={w:"מילים: פירוש, איות והקלטה",t:"כתיבה באצבע",q:"שאלה ← תשובה"};
let LS={ok:0};
function lfin(){
  const n=D.length;
  app.innerHTML=`<div class="big">🏆</div><h1>כל הכבוד ${NAME}!</h1><p class="score">בנושא ללמוד מילים ומשפטים:<br>ענית נכון בניסיון הראשון על <b>${LS.ok}</b> מתוך <b>${n}</b> שאלות</p>
  <div class="menu"><button class="m1" onclick="learn(0)">עוד סיבוב</button><button class="ghost" onclick="home()">לתפריט</button></div>`;
}
function fin(){
  const n=Q.r.length,m=Q.mode;
  app.innerHTML=`<div class="big">🏆</div><h1>כל הכבוד ${NAME}!</h1><p class="score">בנושא ${TP[m]}:<br>ענית נכון בניסיון הראשון על <b>${Q.ok}</b> מתוך <b>${n}</b> שאלות</p>
  <div class="menu"><button class="m4" onclick="${m==='w'?'wstart()':m==='t'?'tstart()':'quiz()'}">עוד סיבוב</button><button class="m1" onclick="learn(0)">חזרה ללמוד</button><button class="ghost" onclick="home()">לתפריט</button></div>`;
}
try{speechSynthesis.getVoices()}catch(e){}
nameScreen();
</script>
