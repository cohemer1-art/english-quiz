<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>לומדים לקרוא</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Rubik:wght@400;500;700;800&display=swap">
<style>
:root{--ink:#1F2A55;--sun:#F5B700;--mint:#0E8C88;--berry:#E8502F;--sky:#2F6FE0;--grape:#6C4CE0;--bg1:#FFF7EA;--bg2:#FFE8D2;--edge:#E6D9C3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Rubik","Heebo","Arial Hebrew",Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
#app{max-width:520px;margin:0 auto;padding:14px 14px 40px;text-align:center;min-height:calc(100vh - 150px);position:relative}
h1{font-size:1.7rem;margin:.3em 0}
.big{font-size:5rem;line-height:1.1}
.sub{color:#5B6180;margin:.3em 0 .8em}
.msg{min-height:1.4em;font-weight:700}
button{font:inherit;font-weight:800;border:0;border-radius:18px;padding:.7em 1em;color:#fff;background:var(--grape);box-shadow:0 5px 0 rgba(0,0,0,.18);cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
button.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--edge)}
button:disabled{opacity:.45}
.menu{display:flex;flex-direction:column;gap:12px;margin:14px 0}
.menu button{font-size:1.25rem;text-align:right;display:flex;align-items:center;gap:12px}
.menu button small{display:block;font-weight:500;opacity:.9;font-size:.82rem}
.menu .ic{font-size:2rem}
.c1{background:#E8502F}.c2{background:#0E8C88}.c3{background:#2F6FE0}.c4{background:#6C4CE0}.c5{background:#D63C7A}.c6{background:#F5B700;color:#2B2200}
input.nm{width:100%;font:inherit;font-size:1.5rem;text-align:center;padding:.6em;border-radius:18px;border:3px solid var(--edge);margin:.5em 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.top .stars{background:#fff;border-radius:99px;padding:.25em .8em;font-weight:800;box-shadow:0 3px 0 var(--edge)}
.bar{height:10px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 2px #EFE3CF;flex:1}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sun));width:0;transition:width .3s}
.mascot{display:flex;align-items:center;gap:10px;background:#fff;border-radius:22px;padding:10px 14px;margin:8px 0;box-shadow:0 4px 0 var(--edge);text-align:right}
.mascot .m{font-size:2.6rem}
.mascot .b{font-weight:700;flex:1}
.card{background:#fff;border-radius:26px;padding:16px;margin:10px 0;box-shadow:0 6px 0 var(--edge)}
.letter{font-size:6.5rem;font-weight:900;line-height:1;color:var(--grape)}
.pic{font-size:5.5rem;line-height:1.1}
.spk{background:var(--sun);color:#2B2200;border-radius:50%;width:56px;height:56px;padding:0;font-size:1.6rem;display:inline-flex;align-items:center;justify-content:center;flex:none}
.spk.sm{width:42px;height:42px;font-size:1.2rem}
.prompt{font-size:1.3rem;font-weight:800;margin:.3em 0;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.opts.two{grid-template-columns:repeat(2,1fr)}
.opts button{background:#fff;color:var(--ink);font-size:3rem;padding:.25em 0;box-shadow:0 5px 0 var(--edge);border-radius:20px}
.opts button.pic2{font-size:3.6rem}
.opts button.sy{font-size:2.6rem}
.opts button.ok{background:#D5F0EE;box-shadow:0 5px 0 #0E8C88}
.opts button.no{background:#FFDCD2;box-shadow:0 5px 0 #E8502F}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.kb{direction:ltr;display:flex;flex-direction:column;gap:6px;margin:12px -6px 0}
.kb .row{display:flex;gap:5px;justify-content:center}
.kb button{flex:1 1 0;min-width:0;max-width:44px;padding:.55em 0;font-size:1.3rem;background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--edge);border-radius:10px}
.kb button.hint{background:var(--sun);animation:pop .6s infinite}
.slots{display:flex;gap:8px;justify-content:center;margin:10px 0;direction:rtl;flex-wrap:wrap}
.slot{width:52px;height:62px;border-radius:14px;border:3px dashed #CDBFA6;background:#fff;font-size:2.2rem;font-weight:900;display:flex;align-items:center;justify-content:center;color:var(--grape)}
.slot.f{border-style:solid;border-color:var(--mint)}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.tiles button{background:#fff;color:var(--ink);font-size:2.2rem;width:58px;height:64px;padding:0;box-shadow:0 5px 0 var(--edge)}
.tiles button.used{visibility:hidden}
.trwrap{position:relative;margin:8px auto;width:min(86vw,340px);aspect-ratio:1;background:#fff;border-radius:26px;box-shadow:0 6px 0 var(--edge);touch-action:none}
.trwrap canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:26px;touch-action:none}
.field{position:relative;height:52vh;min-height:330px;background:linear-gradient(#bfe8ff,#eaf9ff);border-radius:26px;overflow:hidden;margin:10px 0;box-shadow:inset 0 0 0 3px #fff}
.fall{position:absolute;top:-80px;width:78px;height:78px;border-radius:50%;background:#fff;box-shadow:0 5px 0 var(--edge);font-size:3rem;font-weight:900;color:var(--grape);display:flex;align-items:center;justify-content:center;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(var(--h))}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.mc{aspect-ratio:1;font-size:2.6rem;background:var(--grape);color:#fff;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2);user-select:none}
.mc.up{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--edge)}
.mc.done{background:#D5F0EE;color:var(--ink);box-shadow:0 5px 0 #0E8C88}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.chips button{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--edge);padding:.4em .8em;font-size:1rem;border-radius:99px}
.chips button.on{background:var(--grape);color:#fff}
.score{font-size:1.3rem;font-weight:700}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.conf i{position:absolute;top:-40px;font-style:normal;font-size:2rem;animation:cf 2.2s linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(360deg)}}
.row2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.vw{font-size:3.2rem;direction:rtl}
.mini{font-size:.85rem;color:#5B6180}

.brand{max-width:520px;margin:0 auto;padding:12px 14px 0;display:flex;justify-content:center}
.wm{display:flex;align-items:flex-end;gap:2px;direction:rtl;font-family:'Fredoka','Rubik',sans-serif;font-weight:700;font-size:40px;line-height:1;background:#fff;padding:10px 18px 6px;border-radius:22px;box-shadow:0 5px 0 var(--edge)}
.wm .lt{position:relative;display:inline-block}.wm .sp{width:10px}
.wm .eyes{position:absolute;top:-6px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.wm .eyes i{width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid #1F2A55;box-sizing:border-box;display:flex;align-items:center;justify-content:center}
.wm .eyes i:after{content:"";width:4px;height:4px;border-radius:50%;background:#1F2A55}
.foot{max-width:520px;margin:0 auto;padding:6px 14px 26px;text-align:center;font-size:.8rem;color:#5B6180}
</style>
</head>
<body>
<header class="brand"><div class="wm" role="img" aria-label="כמה כיף"><span class="lt" style="color:#0E8C88">כ<span class="eyes" aria-hidden="true"><i></i><i></i></span></span><span class="lt" style="color:#E8502F">מ<span class="eyes" aria-hidden="true"><i></i><i></i></span></span><span class="lt" style="color:#F5A300">ה</span><span class="sp"></span><span class="lt" style="color:#0E8C88">כ</span><span class="lt" style="color:#6C4CE0">י</span><span class="lt" style="color:#1F2A55">ף</span></div></header>
<div id="app"></div>
<footer class="foot">© כל הזכויות שמורות לכמה כיף</footer>
<script src="config.js"></script>
<script>
const app=document.getElementById('app');
let C=null,NAME='',LEVEL=0,GROUP=-1,STARS=0,Q=null,KB=null;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pickN=(a,n)=>shuf(a).slice(0,n);
const SOF={'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
const norm=c=>SOF[c]||c;
const nonik=s=>String(s).replace(/[֑-ׇ]/g,'');
const $=id=>document.getElementById(id);

// ---------- sound: recorded file if it exists, otherwise the browser voice ----------
let heVoice=null;
function loadVoices(){try{heVoice=speechSynthesis.getVoices().find(v=>/^(he|iw)/i.test(v.lang))||null}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
const badAudio=new Set();let curAudio=null;
function tts(text,cb){
  try{const u=new SpeechSynthesisUtterance(text);u.lang='he-IL';if(heVoice)u.voice=heVoice;u.rate=.8;u.pitch=1.1;
    u.onend=()=>cb&&cb();u.onerror=()=>cb&&cb();speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){cb&&cb()}
}
function say(text,key,cb){
  try{if(curAudio){curAudio.pause();curAudio=null}speechSynthesis.cancel()}catch(e){}
  const base=(window.CONFIG||{}).AUDIO;
  if(base&&key&&!badAudio.has(key)){
    let used=false;const fb=()=>{if(used)return;used=true;badAudio.add(key);tts(text,cb)};
    const a=new Audio(String(base).replace(/\/+$/,'')+'/'+key+'.mp3');curAudio=a;
    a.onended=()=>cb&&cb();a.onerror=fb;
    const p=a.play();if(p&&p.catch)p.catch(fb);
    return;
  }
  tts(text,cb);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b){e.stopPropagation();say(b.dataset.t,b.dataset.k||'')}},true);
const spk=(t,k,cls)=>`<button class="spk ${cls||''}" data-t="${t}" data-k="${k||''}" aria-label="שמיעה">🔊</button>`;
let AC=null;
function tone(seq){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
    seq.forEach(([f,d,ty])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.8})}catch(e){}
}
const chime=()=>tone([[660,.12],[880,.12],[1320,.22]]);
const bonk=()=>tone([[220,.18,'triangle'],[180,.22,'triangle']]);
function confetti(n){const d=document.createElement('div');d.className='conf';const em=['⭐','🎉','✨','🌈','🎈'];
  for(let i=0;i<(n||24);i++){const s=document.createElement('i');s.textContent=em[i%em.length];s.style.left=Math.random()*100+'%';s.style.animationDelay=Math.random()*.6+'s';d.appendChild(s)}
  document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}

// ---------- the learner ----------
const SKEY=()=>'kria_'+NAME;
function loadStars(){try{STARS=+localStorage.getItem(SKEY())||0}catch(e){STARS=0}}
function addStar(n){STARS+=n||1;try{localStorage.setItem(SKEY(),STARS)}catch(e){}}
const LEVELS=[
  {n:'גן',e:'🌱',d:'אותיות, צלילים, כתיבה ומקלדת',tops:['ltr','snd','trace','kbd','catch','mem']},
  {n:'כיתה א׳',e:'🌿',d:'הברות עם ניקוד ובניית מילים',tops:['syl','bsyl','bw','tw','kbd2','mem']},
  {n:'כיתה ב׳',e:'🌳',d:'קריאת מילים, השלמה והקלדה',tops:['rd','rd2','miss','dict','tw','catch']}
];
const TOP={
  ltr:{t:'מצאו את האות',e:'🔤',c:'c1',d:'שומעים ומוצאים',f:()=>qLetter()},
  snd:{t:'צליל ותמונה',e:'🖼️',c:'c2',d:'באיזו אות מתחילה המילה?',f:()=>qSound()},
  trace:{t:'כותבים אותיות',e:'✍️',c:'c3',d:'מציירים באצבע',f:()=>qTrace()},
  kbd:{t:'מקלדת: מצאו את האות',e:'⌨️',c:'c4',d:'אות זהה ואות דומה',f:()=>qKey()},
  catch:{t:'תופסים אותיות',e:'🎈',c:'c5',d:'משחק: האות נופלת, תפסו אותה!',f:()=>qCatch()},
  mem:{t:'משחק זיכרון',e:'🃏',c:'c6',d:'אות ותמונה',f:()=>qMem()},
  syl:{t:'שומעים הברה',e:'👂',c:'c1',d:'ניקוד: בוחרים את ההברה',f:()=>qSyl()},
  bsyl:{t:'בונים הברה',e:'🧩',c:'c2',d:'אות + ניקוד',f:()=>qBSyl()},
  bw:{t:'בונים מילה',e:'🏗️',c:'c3',d:'מסדרים אותיות לפי התמונה',f:()=>qBuild()},
  tw:{t:'מקלידים מילה',e:'⌨️',c:'c4',d:'מסתכלים בתמונה וכותבים',f:()=>qType(false)},
  kbd2:{t:'מקלדת: מצאו את האות',e:'🔎',c:'c5',d:'אות זהה ואות דומה',f:()=>qKey()},
  rd:{t:'קוראים עם ניקוד',e:'📖',c:'c1',d:'איזו תמונה מתאימה למילה?',f:()=>qRead(true)},
  rd2:{t:'קוראים בלי ניקוד',e:'🧐',c:'c2',d:'מילה ללא ניקוד, בוחרים תמונה',f:()=>qRead(false)},
  miss:{t:'האות החסרה',e:'🕵️',c:'c3',d:'משלימים אות במילה',f:()=>qMiss()},
  dict:{t:'שומעים וכותבים',e:'📝',c:'c4',d:'המילה מוקראת, מקלידים אותה',f:()=>qType(true)}
};
const L=()=>C.letters; // [letter,name,word,nikud,emoji]
const W=()=>C.words;   // [word,nikud,emoji]
const POOLS=(()=>{return null})();
function pool(){const all=L();if(GROUP<0)return all;const g=C.groups[GROUP];return all.filter(x=>g.includes(x[0]))}
const letterOf=ch=>L().find(x=>x[0]===ch);
function alikeOf(ch){return (C.alike[ch]||[]).map(norm)}
function wordsStarting(ch){return W().filter(w=>w[0][0]===ch)}

// ---------- screens ----------
function mascot(t,speak){
  return `<div class="mascot"><div class="m">🦉</div><div class="b" id="mb">${t}</div>${speak?spk(speak,'',"sm"):''}</div>`;
}
function nameScreen(){
  app.innerHTML=`<div class="big">🦉</div><h1>${C.title}</h1><p class="sub">${C.subtitle||''}</p>
  <p class="sub" style="font-size:1.2rem;font-weight:700">שלום! אני ינשוף. איך קוראים לך?</p>
  <input class="nm" id="nm" placeholder="הקלידו את השם" autocomplete="off" maxlength="14">
  <button id="go" style="font-size:1.4rem;width:100%" class="c2">יוצאים לדרך ←</button>`;
  setTimeout(()=>say('שלום! אני ינשוף. איך קוראים לך?','hello'),300);
  const go=()=>{const v=$('nm').value.trim();if(!v){$('nm').focus();return}NAME=v;loadStars();try{LEVEL=+localStorage.getItem(SKEY()+'_lv')||0}catch(e){}levelScreen()};
  $('go').onclick=go;$('nm').onkeydown=e=>{if(e.key==='Enter')go()};
}
function levelScreen(){
  app.innerHTML=`<div class="top"><span></span><span class="stars">⭐ ${STARS}</span></div>${mascot(`נעים מאוד ${NAME}! באיזו רמה נשחק?`,`נעים מאוד ${NAME}! באיזו רמה נשחק?`)}
  <div class="menu">${LEVELS.map((l,i)=>`<button class="c${i+1}" data-l="${i}"><span class="ic">${l.e}</span><span>${l.n}<small>${l.d}</small></span></button>`).join('')}</div>`;
  app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{LEVEL=+b.dataset.l;try{localStorage.setItem(SKEY()+'_lv',LEVEL)}catch(e){}home()});
}
function home(){
  stopAll();
  const lv=LEVELS[LEVEL];
  app.innerHTML=`<div class="top"><button class="ghost" id="lvb" style="padding:.4em .8em">${lv.e} ${lv.n} · שינוי</button><span class="stars">⭐ ${STARS}</span></div>
  ${mascot(`מה נעשה היום, ${NAME}?`,`מה נעשה היום, ${NAME}?`)}
  ${LEVEL===0?`<div class="mini">אותיות היום (שלוש בכל פעם):</div><div class="chips" id="grp">${C.groups.map((g,i)=>`<button data-g="${i}" class="${GROUP===i?'on':''}">${g.join(' ')}</button>`).join('')}<button data-g="-1" class="${GROUP<0?'on':''}">הכל</button></div>`:''}
  <div class="menu">${lv.tops.map(k=>`<button class="${TOP[k].c}" data-top="${k}"><span class="ic">${TOP[k].e}</span><span>${TOP[k].t}<small>${TOP[k].d}</small></span></button>`).join('')}</div>`;
  $('lvb').onclick=levelScreen;
  app.querySelectorAll('[data-top]').forEach(b=>b.onclick=()=>start(b.dataset.top));
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{GROUP=+b.dataset.g;home()});
}
function stopAll(){try{speechSynthesis.cancel()}catch(e){}if(curAudio){curAudio.pause();curAudio=null}KB=null;if(Q&&Q.timer){clearTimeout(Q.timer)}Q=null}

// ---------- a round ----------
function start(k){
  const N=k==='mem'?1:(k==='catch'?6:(k==='trace'?Math.min(pool().length,6)||3:8));
  Q={k,i:0,n:N,ok:0,first:true,items:null};
  next();
}
function next(){
  if(Q.i>=Q.n){fin();return}
  Q.first=true;Q.locked=false;
  TOP[Q.k].f();
}
function frame(inner,title){
  const pct=Math.round(Q.i/Q.n*100);
  app.innerHTML=`<div class="top"><button class="ghost" id="bk" style="padding:.4em .8em">→ תפריט</button><div class="bar"><i style="width:${pct}%"></i></div><span class="stars">⭐ ${STARS}</span></div>${inner}`;
  $('bk').onclick=home;
}
function right(msg){
  chime();addStar(1);if(Q.first)Q.ok++;
  const mb=$('mb');if(mb)mb.textContent=msg||cheer();
  say(msg||cheer(),'');
  confetti(10);
}
function wrong(){Q.first=false;bonk()}
const CH=['כל הכבוד!','יופי!','מצוין!','איזה יופי!','נהדר!','את/ה אלוף!'];
function cheer(){return CH[Math.random()*5|0]}
function advance(ms){const q=Q;setTimeout(()=>{if(Q!==q)return;Q.i++;next()},ms||1400)}
function fin(){
  const n=Q.n,k=Q.k;const stars=Q.ok;
  confetti(40);chime();
  const txt=k==='mem'?`מצאת את כל הזוגות!`:`ענית נכון בניסיון הראשון על <b>${Q.ok}</b> מתוך <b>${n}</b> שאלות`;
  app.innerHTML=`<div class="big">🏆</div><h1>כל הכבוד ${NAME}!</h1><p class="score">בנושא ${TOP[k].t}:<br>${txt}</p><p class="sub">⭐ ${STARS} כוכבים בסך הכול</p>
  <div class="menu"><button class="c2" onclick="start('${k}')">עוד סיבוב</button><button class="ghost" onclick="home()">לתפריט</button></div>`;
  say(`כל הכבוד ${NAME}!`,'');
}
// ---------- helpers for questions ----------
function items(){
  if(!Q.items){
    const base=['bw','tw','dict','rd','rd2','miss'].includes(Q.k)?W():pool();
    let a=[];while(a.length<Q.n)a=a.concat(shuf(base));Q.items=a.slice(0,Q.n);
  }
  return Q.items;
}
function auto(text,key){const q=Q;setTimeout(()=>{if(Q===q)say(text,key||'')},350)}
const lidx=t=>L().indexOf(t);
const skey=t=>'s_'+[...t].map(ch=>ch.charCodeAt(0).toString(16)).join('-');
function distract(ch,n){
  const al=shuf(alikeOf(ch)).filter(c=>c!==ch);
  const rest=shuf(L().map(x=>x[0]).filter(c=>c!==ch&&!al.includes(c)));
  return al.concat(rest).slice(0,n);
}

  in_use:'הקוד הזה כבר הופעל בטלפון אחר, ואפשר להשתמש בו רק בטלפון אחד. אם החלפתם טלפון או דפדפן – פנו אלינו ונאפס את הקוד.',
  unavailable:'אין חיבור לשרת כרגע. בדקו שיש אינטרנט ונסו שוב בעוד רגע.',
  unknown_quiz:'הקישור הזה אינו תקין. פתחו את הקישור שקיבלתם לאחר הרכישה.',
  bad_device:'הדפדפן לא מאפשר לשמור נתונים. פתחו את הקישור בדפדפן רגיל (Chrome).',
  server_error:'משהו השתבש אצלנו. נסו שוב בעוד רגע.',
  server_not_configured:'השרת עדיין לא הוגדר עד הסוף.'
};
const errText=e=>(ERR[e]||ERR.server_error)+(CONTACT&&(e==='in_use'||e==='server_error')?`<br><b>${CONTACT}</b>`:'');
async function callApi(path,body){
  try{
    const r=await fetch(API+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined);
    return await r.json();
  }catch(e){return {ok:false,error:'unavailable'}}
}
function boot(c){C=c;if(c.title)document.title=c.title;nameScreen()}
function loading(t){app.innerHTML=`<div class="big">⏳</div><p class="sub">${t||'בודקים…'}</p>`}
function problem(title,html){app.innerHTML=`<div class="big">⚠️</div><h1>${title}</h1><p class="sub" style="color:inherit">${html}</p>`}
async function activate(key,silent){
  loading('בודקים את הקוד…');
  const r=await callApi('/activate',{quiz:QID,key,device:DEV});
  if(r&&r.ok&&r.content){try{localStorage.setItem('lic_'+QID,key)}catch(e){}boot(r.content);return}
  if(!silent||r.error==='in_use'||r.error==='refunded'){try{localStorage.removeItem('lic_'+QID)}catch(e){}}
  if(r.error==='unavailable'&&silent){
    app.innerHTML=`<div class="big">📡</div><p class="sub" style="color:inherit">${errText('unavailable')}</p><button id="retry">נסו שוב</button>`;
    document.getElementById('retry').onclick=()=>activate(key,true);return;
  }
  gateScreen(errText(r.error),key);
}
function gateScreen(msg,prefill){
  app.innerHTML=`<div class="big">🔑</div><h1>הכניסו את קוד הגישה</h1><p class="sub">הקוד נשלח אליכם במייל אחרי הרכישה</p>
  <input class="nm" id="code" dir="ltr" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX" style="font-size:1.05rem">
  <p class="msg" id="cmsg" style="color:var(--berry)">${msg||''}</p><button id="cgo" style="font-size:1.3rem">כניסה ←</button>
  <p class="sub" style="font-size:.85rem">הקוד פועל בטלפון אחד בלבד. כדאי לפתוח תמיד באותו דפדפן.</p>`;
  document.getElementById('code').value=prefill||'';
  const go=()=>{const v=document.getElementById('code').value.trim();if(v.length<8){document.getElementById('cmsg').textContent='צריך להקליד את הקוד 🙂';return}activate(v,false)};
  document.getElementById('cgo').onclick=go;
  document.getElementById('code').onkeydown=e=>{if(e.key==='Enter')go()};
}
async function picker(){
  loading('טוענים…');
  const r=await callApi('/catalog');
  if(!r.ok||!r.quizzes||!r.quizzes.length){problem('אין מבדקים להצגה',errText(r.error||'unavailable'));return}
  app.innerHTML=`<h1>בחרו מבדק</h1><div class="menu">${r.quizzes.map(q=>`<button class="m1" data-q="${String(q.id).replace(/[^A-Za-z0-9_-]/g,'')}">${String(q.title).replace(/[<>&]/g,'')}</button>`).join('')}</div>`;
  app.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{location.search='?q='+b.dataset.q});
}
function gate(){
  if(!API||/REPLACE/i.test(API)){problem('צריך להגדיר את כתובת השרת','פותחים את הקובץ config.js ומדביקים בו את כתובת השרת.');return}
  if(!DEV){problem('אי אפשר להמשיך',errText('bad_device'));return}
  if(!QID){picker();return}
  let saved=null;try{saved=localStorage.getItem('lic_'+QID)}catch(e){}
  if(saved)activate(saved,true);else gateScreen('');
}
gate();
</script>
</body>
</html>
